<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order with us</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:rgba(0,0,0,.08);--fill:#efeff2;--accent:#1d1d1f;--onaccent:#fff;--s2:#2ea44f;--warn:#b45309;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0d;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:rgba(255,255,255,.1);--fill:#2c2c2e;--accent:#f5f5f7;--onaccent:#1d1d1f;--s2:#32d74b;--warn:#ffb340;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
[hidden]{display:none!important}
h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:10px 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.auth{max-width:400px;margin:9vh auto 0}
.tabs{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:12px;margin-bottom:16px}
.tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.tab[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--fill);color:var(--ink);font:16px inherit;transition:border-color .2s,background .2s}
input:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--card)}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{padding:13px 18px;border-radius:99px;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:16px;font-weight:650;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);color:var(--onaccent);width:100%;margin-top:18px}
.btn.small{padding:8px 14px;font-size:14px}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;display:flex;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.thumb{width:84px;height:84px;border-radius:14px;background:var(--fill);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--mute);font-size:12px}
.body{flex:1;min-width:0}
.name{font-weight:650;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px;margin:3px 0 8px}
.steps{display:flex;gap:4px;margin:8px 0 6px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--fill)}
.steps i.on{background:var(--s2)}
.state{font-size:13px;font-weight:600}
h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:24px 4px 10px}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.hint{color:var(--mute);font-size:13px;margin:6px 2px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
:focus-visible{outline:2px solid #5e5ce6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="auth" class="auth" hidden>
  <h1>Welcome</h1>
  <p class="sub">Send us the product you love and we’ll get it for you.</p>
  <div class="panel">
    <div class="tabs">
      <button class="tab" data-mode="login" aria-pressed="true">Log in</button>
      <button class="tab" data-mode="register" aria-pressed="false">Register</button>
    </div>
    <div id="a-name" hidden><label for="a-n">Your name</label><input id="a-n" dir="auto" autocomplete="name"></div>
    <label for="a-ph">Phone number</label><input id="a-ph" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx">
    <label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    <button class="btn main" id="a-go">Log in</button>
  </div>
</main>

<main id="app" hidden>
  <div class="head"><div><h1 id="hi">Hello</h1><p class="sub">Add a product or follow your orders.</p></div>
  <button class="btn small" id="out">Log out</button></div>
  <div class="tabs">
    <button class="tab" data-view="new" aria-pressed="true">New order</button>
    <button class="tab" data-view="mine" aria-pressed="false">My orders</button>
  </div>

  <section id="v-new" class="panel">
    <label for="o-img">Photo of the product</label>
    <input type="file" id="o-img" accept="image/*">
    <img class="preview" id="o-prev" alt="Selected product photo">
    <label for="o-brand">Brand</label><input id="o-brand" dir="auto" placeholder="e.g. Gucci">
    <label for="o-prod">Product details (optional)</label><input id="o-prod" dir="auto" placeholder="e.g. small shoulder bag">
    <div class="row">
      <div><label for="o-size">Size</label><input id="o-size" dir="auto" placeholder="e.g. 38"></div>
      <div><label for="o-color">Color</label><input id="o-color" dir="auto" placeholder="e.g. Black"></div>
    </div>
    <label for="o-ph">WhatsApp number</label><input id="o-ph" inputmode="tel">
    <label for="o-note">Notes (optional)</label><textarea id="o-note" rows="2" dir="auto"></textarea>
    <button class="btn main" id="o-go">Send order</button>
  </section>

  <section id="v-mine" hidden><div id="list"></div></section>
</main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://gpyyossbvpcfwrvueuls.supabase.co',SB_KEY='sb_publishable_tv9IbZhQF_huqXX_Dh15PQ_LBxsTZ_c',SHOPPER='223c6c9a-baca-4fb9-b3e1-6aa48c0405a7';
var sb=supabase.createClient(SB_URL,SB_KEY);
var STAGES=['Requested','Waiting for payment','Paid','Delivery'];
var $=function(i){return document.getElementById(i)},session=null,mode='login',imgData='',urls={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},3000)}
function digits(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);else if(d.charAt(0)==='0')d='971'+d.slice(1);return d}
function mail(p){return digits(p)+'@customers.shopperdesk.app'}

document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.mode){mode=t.dataset.mode;document.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-pressed',b===t)});
    $('a-name').hidden=mode!=='register';$('a-go').textContent=mode==='register'?'Create account':'Log in';
    $('a-pw').autocomplete=mode==='register'?'new-password':'current-password'}
  if(t.dataset.view){document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-pressed',b===t)});
    $('v-new').hidden=t.dataset.view!=='new';$('v-mine').hidden=t.dataset.view!=='mine';if(t.dataset.view==='mine')load()}
});

$('a-go').onclick=async function(){
  var ph=$('a-ph').value,pw=$('a-pw').value,b=$('a-go');
  if(digits(ph).length<10){toast('Enter a valid phone number');return}
  if(pw.length<6){toast('Password needs at least 6 characters');return}
  b.disabled=true;
  try{
    if(mode==='register'){
      var nm=$('a-n').value.trim();if(!nm){toast('Please enter your name');b.disabled=false;return}
      var r=await sb.auth.signUp({email:mail(ph),password:pw,options:{data:{name:nm,phone:digits(ph)}}});
      if(r.error){toast(/registered|exists/i.test(r.error.message)?'This number is already registered. Please log in.':r.error.message);b.disabled=false;return}
      if(!r.data.session){var l=await sb.auth.signInWithPassword({email:mail(ph),password:pw});if(l.error)toast('Account created. Please log in.')}
    }else{
      var s=await sb.auth.signInWithPassword({email:mail(ph),password:pw});
      if(s.error)toast('Wrong phone number or password');
    }
  }catch(er){toast('Connection problem. Try again.')}
  b.disabled=false;
};
$('out').onclick=function(){sb.auth.signOut()};

$('o-img').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    imgData=c.toDataURL('image/jpeg',.8);$('o-prev').src=imgData;$('o-prev').style.display='block'};im.src=r.result};r.readAsDataURL(f)};

$('o-go').onclick=async function(){
  var v=function(k){return $('o-'+k).value.trim()},b=$('o-go');
  if(!imgData){toast('Please add a photo of the product');return}
  if(!v('brand')){toast('Please enter the brand');return}
  if(digits(v('ph')).length<10){toast('Enter your WhatsApp number');return}
  b.disabled=true;b.textContent='Sending…';
  try{
    var u=session.user,path=u.id+'/'+Date.now()+'.jpg';
    var blob=await (await fetch(imgData)).blob();
    var up=await sb.storage.from('screenshots').upload(path,blob,{contentType:'image/jpeg'});
    if(up.error)throw new Error(up.error.message);
    var ins=await sb.from('orders').insert({shopper_id:SHOPPER,customer_id:u.id,customer_name:(u.user_metadata||{}).name||null,customer_phone:digits(v('ph')),
      brand:v('brand'),product:v('prod')||null,size:v('size')||null,color:v('color')||null,raw_message:v('note')||null,image_path:path,stage:0});
    if(ins.error)throw new Error(ins.error.message);
    ['brand','prod','size','color','note'].forEach(function(k){$('o-'+k).value=''});$('o-img').value='';imgData='';$('o-prev').style.display='none';
    toast('Order sent. We’ll message you soon.');
    document.querySelector('[data-view="mine"]').click();
  }catch(er){toast('Could not send: '+er.message)}
  b.disabled=false;b.textContent='Send order';
};

async function load(){
  var r=await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(r.error){toast(r.error.message);return}
  var o=r.data,paths=o.filter(function(x){return x.image_path}).map(function(x){return x.image_path});urls={};
  if(paths.length){var s=await sb.storage.from('screenshots').createSignedUrls(paths,3600);(s.data||[]).forEach(function(x){if(x.signedUrl)urls[x.path]=x.signedUrl})}
  var act=o.filter(function(x){return x.stage<3}),his=o.filter(function(x){return x.stage>=3});
  $('list').innerHTML=(o.length?'':'<div class="empty">No orders yet. Add your first one in “New order”.</div>')
    +(act.length?'<h2>In progress</h2>'+act.map(card).join(''):'')+(his.length?'<h2>Purchase history</h2>'+his.map(card).join(''):'');
}
function card(o){
  var st=Math.min(o.stage,3),u=urls[o.image_path],th=u?'<img class="thumb" alt="Product" src="'+esc(u)+'">':'<div class="thumb">No photo</div>';
  var steps='<div class="steps">'+STAGES.map(function(s,i){return '<i class="'+(i<=st?'on':'')+'"></i>'}).join('')+'</div>';
  return '<div class="card">'+th+'<div class="body"><div class="name">'+esc((o.brand||'')+(o.product?' · '+o.product:''))+'</div>'
   +'<div class="meta">'+[o.size?'Size '+esc(o.size):'',o.color?esc(o.color):'',new Date(o.created_at).toLocaleDateString()].filter(Boolean).join(' · ')+'</div>'
   +steps+'<div class="state">'+STAGES[st]+'</div></div></div>';
}

function show(){
  $('auth').hidden=!!session;$('app').hidden=!session;
  if(session){var m=session.user.user_metadata||{};$('hi').textContent='Hello'+(m.name?', '+m.name:'');$('o-ph').value=m.phone||''}
}
sb.auth.onAuthStateChange(function(ev,s){var was=!!session;session=s;if(!!s!==was)show()});
sb.auth.getSession().then(function(r){session=r.data.session;show()});
</script>
</body>
</html>
