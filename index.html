<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopper Desk</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:rgba(0,0,0,.08);--fill:#efeff2;--accent:#1d1d1f;--onaccent:#fff;--chat:#128c7e;--s0:#8e8e93;--s1:#ff9f0a;--s2:#2ea44f;--s3:#5e5ce6;--warn:#b45309;--warnbg:#fff4e5;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0d;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:rgba(255,255,255,.1);--fill:#2c2c2e;--accent:#f5f5f7;--onaccent:#1d1d1f;--chat:#30d158;--s1:#ffb340;--s2:#32d74b;--s3:#7d7aff;--warn:#ffb340;--warnbg:#3a2a14;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:20px 16px 110px}
[hidden]{display:none!important}
h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:10px 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tabs{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:12px;margin-bottom:14px}
.tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--mute);font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.tab[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;display:flex;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.thumb{width:84px;height:84px;border-radius:14px;background:var(--fill);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--mute);font-size:12px}
.body{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:650;font-size:17px;letter-spacing:-.01em;overflow-wrap:anywhere}
.price{color:var(--mute);white-space:nowrap;font-size:15px;font-weight:500}
.meta{color:var(--mute);font-size:14px;margin:3px 0 8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--fill);color:var(--ink)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s0)}
.badge.s1::before{background:var(--s1)}.badge.s2::before{background:var(--s2)}.badge.s3::before{background:var(--s3)}
.miss{background:var(--warnbg);color:var(--warn);font-size:13px;font-weight:500;padding:6px 10px;border-radius:10px;margin:8px 0 2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{padding:8px 14px;border-radius:99px;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active,.chip:active,.fab:active{transform:scale(.96)}
.btn.main{background:var(--accent);color:var(--onaccent)}
.btn.chat{background:var(--chat);color:#fff}
.btn.del{background:transparent;color:var(--warn)}
.group h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:22px 4px 10px}
.pick{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border:0}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:15px 26px;border-radius:99px;border:0;background:var(--accent);color:var(--onaccent);font:inherit;font-size:16px;font-weight:650;box-shadow:0 8px 28px rgba(0,0,0,.28);cursor:pointer;transition:transform .15s}
.fab:active{transform:translateX(-50%) scale(.96)}
dialog{width:min(100vw,520px);max-height:92vh;overflow:auto;margin:auto auto 0;border:0;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--ink)}
@media (min-width:600px){dialog{margin:auto;border-radius:26px}}
dialog[open]{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
dialog::backdrop{background:rgba(0,0,0,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#d-title{margin:0 0 6px!important;font:700 24px/1.2 -apple-system,BlinkMacSystemFont,"Inter",sans-serif!important;letter-spacing:-.02em}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:var(--fill);color:var(--ink);font:16px inherit;transition:border-color .2s,background .2s}
input:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--card)}
.row{display:flex;gap:10px}.row>div{flex:1}
.login{max-width:380px;margin:14vh auto 0;background:var(--card);border-radius:26px;padding:28px 24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.login .acts .btn{width:100%;text-align:center;padding:13px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--s3);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="login" class="login" hidden>
  <h1>Shopper Desk</h1>
  <p class="sub">Log in to see your orders.</p>
  <label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username">
  <label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password">
  <div class="acts"><button class="btn main" id="l-go">Log in</button></div>
</main>

<main id="desk" hidden>
  <div class="head"><div><h1>Shopper Desk</h1><p class="sub">Every order, customer and status in one place.</p></div>
  <button class="btn" id="out">Log out</button></div>
  <div class="tabs">
    <button class="tab" data-view="orders" aria-pressed="true">Orders</button>
    <button class="tab" data-view="stores" aria-pressed="false">Shopping list</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <button class="fab" id="add">+ New order</button>
</main>

<dialog id="dlg">
  <h2 id="d-title" style="margin:0 0 4px;font:600 20px Georgia,serif">New order</h2>
  <div class="newonly">
    <label for="f-img">Customer’s screenshot</label><input type="file" id="f-img" accept="image/*">
    <label for="f-msg">Customer’s message (optional)</label><textarea id="f-msg" rows="3" placeholder="Paste what they wrote, e.g. size 38 in black"></textarea>
  </div>
  <div class="row">
    <div><label for="f-cust">Customer</label><input id="f-cust"></div>
    <div><label for="f-ph">WhatsApp number</label><input id="f-ph" inputmode="tel" placeholder="9715…"></div>
  </div>
  <div class="editonly">
    <div class="row">
      <div><label for="f-brand">Brand</label><input id="f-brand"></div>
      <div><label for="f-price">Price (AED)</label><input id="f-price" inputmode="decimal"></div>
    </div>
    <label for="f-prod">Product</label><input id="f-prod">
    <div class="row">
      <div><label for="f-size">Size</label><input id="f-size"></div>
      <div><label for="f-color">Color</label><input id="f-color"></div>
    </div>
  </div>
  <div class="acts" style="margin-top:16px;justify-content:flex-end">
    <button class="btn" id="cancel">Cancel</button>
    <button class="btn main" id="save">Add order</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL='https://gpyyossbvpcfwrvueuls.supabase.co',SB_KEY='sb_publishable_tv9IbZhQF_huqXX_Dh15PQ_LBxsTZ_c',FN='ingest';
var sb=supabase.createClient(SB_URL,SB_KEY);
var STAGES=['Requested','Waiting for payment','Paid','Delivery'];
var orders=[],urls={},view='orders',filter='All',imgData='',editId=null,session=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2800)}
function missing(o){var m=[];if(!o.size)m.push('size');if(!o.color)m.push('color');return m}
function waNum(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);else if(d.charAt(0)==='0')d='971'+d.slice(1);return d}
function wa(o,t){return 'https://wa.me/'+waNum(o.customer_phone)+'?text='+encodeURIComponent(t)}
function chat(o){return 'https://wa.me/'+waNum(o.customer_phone)}
function who(o){return o.customer_name||'there'}
function ask(o){return 'Hi '+who(o)+', I found your '+(o.brand||'')+' '+(o.product||'item')+'. Which '+missing(o).join(' and ')+' would you like?'}
function pay(o){return 'Hi '+who(o)+', your '+(o.brand||'')+' '+(o.product||'item')+(o.size?' (size '+o.size+')':'')+(o.color?' in '+o.color:'')+' is confirmed: AED '+(o.price||0)+'. Pay here: [paste your payment link]'}

async function load(){
  var r=await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(r.error){toast(r.error.message);return}
  orders=r.data;urls={};
  var paths=orders.filter(function(o){return o.image_path}).map(function(o){return o.image_path});
  if(paths.length){var s=await sb.storage.from('screenshots').createSignedUrls(paths,3600);
    (s.data||[]).forEach(function(x){if(x.signedUrl)urls[x.path]=x.signedUrl})}
  render();
}
function card(o){
  var st=Math.min(o.stage,3),m=missing(o),last=st===3,u=urls[o.image_path];
  var th=u?'<img class="thumb" alt="Screenshot" src="'+esc(u)+'">':'<div class="thumb">No photo</div>';
  var a='';
  if(m.length&&o.customer_phone&&!last)a+='<a class="btn main" target="_blank" rel="noopener" href="'+wa(o,ask(o))+'">Ask '+m.join(' + ')+'</a>';
  if(o.customer_phone)a+='<a class="btn chat" target="_blank" rel="noopener" href="'+chat(o)+'">Chat</a>';
  if(!m.length&&st<2)a+='<button class="btn main" data-a="pay" data-id="'+o.id+'">Copy payment message</button>';
  if(!last)a+='<button class="btn" data-a="next" data-id="'+o.id+'">Mark '+STAGES[st+1].toLowerCase()+'</button>';
  a+='<button class="btn" data-a="edit" data-id="'+o.id+'">Edit</button><button class="btn del" data-a="del" data-id="'+o.id+'">Remove</button>';
  return '<div class="card">'+th+'<div class="body"><div class="top"><span class="name">'+esc(o.product||'Item (add details)')+'</span><span class="price">AED '+esc(o.price||0)+'</span></div>'
   +'<div class="meta">'+esc(o.customer_name||'No name')+' · '+esc(o.brand||'Brand?')+(o.size?' · '+esc(o.size):'')+(o.color?' · '+esc(o.color):'')+'</div>'
   +'<span class="badge s'+st+'">'+STAGES[st]+'</span>'
   +(m.length&&!last?'<div class="miss">Still needed: '+m.join(', ')+'</div>':'')
   +'<div class="acts">'+a+'</div></div></div>'}
function render(){
  var c='<button class="chip" data-f="All" aria-pressed="'+(filter==='All')+'">All ('+orders.length+')</button>';
  STAGES.forEach(function(s,i){var n=orders.filter(function(o){return o.stage===i}).length;
    c+='<button class="chip" data-f="'+i+'" aria-pressed="'+(String(filter)===String(i))+'">'+s+' ('+n+')</button>'});
  $('chips').style.display=view==='orders'?'flex':'none';$('chips').innerHTML=c;
  var out='';
  if(view==='orders'){
    var f=orders.filter(function(o){return filter==='All'||String(o.stage)===String(filter)});
    out=f.length?f.map(card).join(''):'<div class="empty">No orders here yet. Tap “New order” to add one.</div>';
  }else{
    var by={};orders.filter(function(o){return o.stage<3}).forEach(function(o){var b=o.brand||'Other';(by[b]=by[b]||[]).push(o)});
    var k=Object.keys(by);
    out=k.length?k.map(function(b){return '<div class="group"><h2>'+esc(b)+'</h2><div class="card" style="display:block">'+by[b].map(function(o){
      return '<div class="pick"><div class="body"><div class="name">'+esc(o.product||'Item')+'</div><div class="meta" style="margin:0">for '+esc(o.customer_name||'?')+(o.size?' · '+esc(o.size):' · size?')+(o.color?' · '+esc(o.color):' · color?')+'</div></div><span class="badge">'+STAGES[o.stage]+'</span></div>'}).join('')+'</div></div>'}).join(''):'<div class="empty">Nothing to look for right now.</div>';
  }
  $('list').innerHTML=out;
}

document.addEventListener('click',async function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.view){view=t.dataset.view;document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-pressed',b===t)});render();return}
  if(t.dataset.f!==undefined){filter=t.dataset.f;render();return}
  var o=orders.filter(function(x){return String(x.id)===t.dataset.id})[0];if(!o)return;
  if(t.dataset.a==='next'){var r=await sb.from('orders').update({stage:o.stage+1}).eq('id',o.id);if(r.error)toast(r.error.message);load()}
  if(t.dataset.a==='del'){if(!confirm('Remove this order?'))return;await sb.from('orders').delete().eq('id',o.id);load()}
  if(t.dataset.a==='pay'){try{await navigator.clipboard.writeText(pay(o));toast('Message copied')}catch(er){toast('Copy not allowed here')}}
  if(t.dataset.a==='edit'){openDlg(o)}
});

function openDlg(o){
  editId=o?o.id:null;imgData='';
  document.querySelectorAll('.newonly').forEach(function(x){x.hidden=!!o});
  document.querySelectorAll('.editonly').forEach(function(x){x.hidden=!o});
  $('d-title').textContent=o?'Edit order':'New order';$('save').textContent=o?'Save changes':'Add order';
  $('f-img').value='';$('f-msg').value='';
  $('f-cust').value=o?o.customer_name||'':'';$('f-ph').value=o?o.customer_phone||'':'';
  $('f-brand').value=o?o.brand||'':'';$('f-prod').value=o?o.product||'':'';
  $('f-size').value=o?o.size||'':'';$('f-color').value=o?o.color||'':'';$('f-price').value=o&&o.price?o.price:'';
  $('dlg').showModal();
}
$('add').onclick=function(){openDlg(null)};
$('cancel').onclick=function(){$('dlg').close()};
$('f-img').onchange=function(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    imgData=c.toDataURL('image/jpeg',.8)};im.src=r.result};r.readAsDataURL(file)};
$('save').onclick=async function(){
  var b=$('save'),v=function(k){return $('f-'+k).value.trim()};
  b.disabled=true;
  try{
    if(editId){
      var r=await sb.from('orders').update({customer_name:v('cust')||null,customer_phone:v('ph')||null,brand:v('brand')||null,product:v('prod')||null,size:v('size')||null,color:v('color')||null,price:parseFloat(v('price'))||null}).eq('id',editId);
      if(r.error)throw new Error(r.error.message);
    }else{
      if(!imgData&&!v('msg')){toast('Add a screenshot or the customer’s message');b.disabled=false;return}
      b.textContent='Reading…';
      var res=await fetch(SB_URL+'/functions/v1/'+FN,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SB_KEY},
        body:JSON.stringify({image_base64:imgData?imgData.split(',')[1]:null,media_type:'image/jpeg',message:v('msg'),customer_name:v('cust'),customer_phone:v('ph')})});
      var d=await res.json();if(!res.ok)throw new Error(d.error||'Server error');
    }
    $('dlg').close();await load();
  }catch(er){toast('Could not save: '+er.message)}
  b.disabled=false;
};

$('l-go').onclick=async function(){
  var r=await sb.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});
  if(r.error)toast('Login failed: '+r.error.message);
};
$('out').onclick=function(){sb.auth.signOut()};
function show(){$('login').hidden=!!session;$('desk').hidden=!session;if(session)load()}
sb.auth.onAuthStateChange(function(ev,s){var was=!!session;session=s;if(!!s!==was)show()});
sb.auth.getSession().then(function(r){session=r.data.session;show()});
</script>
</body>
</html>
